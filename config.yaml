# ═══════════════════════════════════════════════════════════════
#  PinDrop Pro — behavior config (SECRETS go in .env, not here)
# ═══════════════════════════════════════════════════════════════

pinterest:
  board_name: "Best Deals"            # pins go into this board (auto-created)
  redirect_uri: "http://localhost:8888/callback"

posting:
  pins_per_day: 8          # how many pins per day
  start_hour: 9            # posting window start (IST)
  end_hour: 22             # posting window end (IST)
  min_gap_minutes: 40      # minimum gap between pins (human-like)
  jitter_minutes: 25       # extra random delay added on top
  schedule_days_ahead: 0   # 0 = post instantly, 1..14 = schedule ahead
  pins_per_product: 3      # pin variations per product (different photo + design)
  peak_mode: true          # post only in peak IST traffic windows (viral trick)
  board_strategy: niche    # niche keyword boards per category = more search surfaces

link:
  bridge: false            # true → pins point at YOUR domain /go/<id> (click tracking
                           # + Pinterest never sees a flagged affiliate domain)
  public_base: ""          # e.g. https://yourdeals.in — host the dashboard there
  landing: true            # warm-up landing page (converts 3-8× raw links)

scraping:
  delay_seconds: 4         # pause between scrapes (be polite, avoid blocks)
  timeout_seconds: 25
  max_retries: 2
  max_images: 3            # gallery photos to download per product

reshare:
  min_clicks: 3            # proven winners = products with ≥ this many clicks
  rest_days: 7             # let a winner rest this long before a fresh re-pin
  max_shares: 3            # never spam: max total posts per product

video:
  auto_reel: true          # no product video on the page? auto-generate a
                           # viral 6s reel from the photos (hook → zoom → CTA)
  lang: en-IN              # voiceover: en-IN | hi-IN | te-IN (free neural TTS)
  music: ""                # optional BGM mp3 path, ducked under the voiceover

autopilot:
  auto_source: true        # ZERO-TOUCH: hunt trending products when queue is low
  min_queue: 5
  discover_limit: 4        # products per store per hunt cycle

design:
  width: 1000
  height: 1500             # Pinterest's ideal 2:3 vertical ratio
  accent_color: "#E60023"
  brand_name: "Deal Drops" # your page/brand strip on every pin ("" = off)
  cta_text: "Shop Now ➜"

affiliate:
  amazon_tag: ""           # Amazon Associates tag, e.g. mydeals-21 (or set AMAZON_TAG in .env)
  meesho_affid: ""         # Meesho affiliate id
  flipkart_affid: ""       # Flipkart affiliate id (empty = wraps via earnkaro/cuelinks)
  earnkaro_prefix: ""      # e.g. https://ekaro.in/enkr20240101s123456
  cuelinks_template: ""    # template with {url} placeholder
  generic_template: ""     # fallback wrapper with {url} for any other shop
  default_wrapper: earnkaro  # wrapper for non-amazon/meesho/flipkart links

seo:
  hashtags: true
  max_hashtags: 8
  extra_hashtags:
    - "#onlineshopping"
    - "#bestdeals"
    - "#dealsindia"
  description_template: |
    🔥 {title}
    💰 Price: {price}
    ✅ Best price guarantee — tap to grab this deal before it's gone!
    {hashtags}

instagram:
  enabled: false            # true → every product also posts to your IG page
  ig_user_id: ""            # or IG_USER_ID in .env
  mode: carousel            # single | carousel | reel
  posts_per_day: 3
  host_designed_pins: false # true → upload designed pins to ImgBB (IMGBB_KEY in .env)
  caption_template: |
    🔥 {title}
    💰 Price: {price}
    🛒 Comment 'LINK' — link in bio!
    {hashtags}

storage:
  db_path: data/pindrop.db
  media_dir: data/media

dashboard:
  host: 0.0.0.0
  port: 5000

timezone: Asia/Kolkata
